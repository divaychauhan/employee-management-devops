name: Development Deployment

on:
  push:
    branches:
      - dev

jobs:

  backend:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Docker Image
        run: |
          docker build -t divaypratap/employee-management-backend:dev ./backend

      - name: Push Backend Docker Image
        run: |
          docker push divaypratap/employee-management-backend:dev

      - name: Deploy Backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.BACKEND_USERNAME }}
          key: ${{ secrets.BACKEND_SSH_KEY }}
          port: 22

          script: |
            docker pull divaypratap/employee-management-backend:dev

            docker stop backend-app || true
            docker rm backend-app || true

            docker run -d \
              --name backend-app \
              --restart unless-stopped \
              -e MONGO_URI="${{ secrets.MONGO_URI }}" \
              -p 5000:5000 \
              divaypratap/employee-management-backend:dev

            docker image prune -af

            docker ps

  frontend:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug Frontend
        run: |
          echo "===== CURRENT COMMIT ====="
          git rev-parse HEAD

          echo "===== FRONTEND TITLE ====="
          grep "<title>" frontend/index.html

          echo "===== FRONTEND FILES ====="
          ls -R frontend

      - name: Copy Frontend Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}

          source: "frontend/*"
          target: "/tmp"

      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}

          script: |
            echo "===== TMP TITLE ====="
            grep "<title>" /tmp/frontend/index.html || true

            sudo rm -rf /var/www/html/*
            sudo cp -rf /tmp/frontend/* /var/www/html/

            sudo chown -R www-data:www-data /var/www/html/

            echo "===== HTML TITLE ====="
            grep "<title>" /var/www/html/index.html || true

            sudo systemctl restart nginx

            sudo systemctl status nginx --no-pager