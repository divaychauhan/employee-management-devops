name: Deploy Production Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Docker Image
        run: |
          docker build -t divaypratap/employee-management-backend:latest ./backend

      - name: Push Backend Docker Image
        run: |
          docker push divaypratap/employee-management-backend:latest

      - name: Deploy Backend to Production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s

          script: |
            docker pull divaypratap/employee-management-backend:latest

            docker stop backend-app || true
            docker rm backend-app || true

            docker run -d \
              --name backend-app \
              --restart unless-stopped \
              -e MONGO_URI="${{ secrets.MONGO_URI }}" \
              -p 5000:5000 \
              divaypratap/employee-management-backend:latest

            docker image prune -af

            sleep 10

            docker ps

            docker logs backend-app --tail 20

            curl http://localhost:5000/api/employees