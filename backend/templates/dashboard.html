<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>

body{
font-family:Arial,sans-serif;
background:#111;
color:white;
padding:40px;
}

h1{
color:orange;
}

table{
width:100%;
border-collapse:collapse;
margin-top:30px;
}

th,td{
border:1px solid #555;
padding:12px;
text-align:center;
}

th{
background:orange;
color:black;
}

a{
text-decoration:none;
padding:8px 12px;
border-radius:5px;
color:white;
}

.edit{
background:#2196F3;
}

.delete{
background:red;
}

.logout{
float:right;
background:orange;
color:black;
padding:10px 15px;
}

.card{

background:#222;

padding:20px;

border-radius:10px;

width:250px;

margin-bottom:30px;

}

</style>

</head>

<body>

<a href="/admin/logout" class="logout">

Logout

</a>

<h1>🎸 Guitar Academy Admin Dashboard</h1>

<div class="card">

<h2>Total Students</h2>

<h1>{{ total }}</h1>

</div>

<table>

<tr>

<th>Name</th>

<th>Phone</th>

<th>Email</th>

<th>City</th>

<th>Batch</th>

<th>Action</th>

</tr>

{% for student in students %}

<tr>

<td>{{ student.student_name }}</td>

<td>{{ student.phone }}</td>

<td>{{ student.email }}</td>

<td>{{ student.city }}</td>

<td>{{ student.batch }}</td>

<td>

<a href="#" class="edit">Edit</a>


<a href="/admin/delete/{{ student._id }}" class="delete">Delete</a>

</td>

</tr>

{% endfor %}

</table>

</body>
</html>
