<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:#111;

}

.login-box{

width:400px;

background:#1b1b1b;

padding:40px;

border-radius:20px;

box-shadow:0 15px 35px rgba(0,0,0,.35);

text-align:center;

}

h1{

color:#ff9800;

margin-bottom:10px;

}

p{

color:#ccc;

margin-bottom:30px;

}

input{

width:100%;

padding:15px;

margin-bottom:20px;

border:none;

outline:none;

border-radius:10px;

background:#2a2a2a;

color:white;

}

button{

width:100%;

padding:15px;

border:none;

border-radius:10px;

background:#ff9800;

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#ffb347;

}

.error{

background:#ff4d4d;

padding:10px;

border-radius:8px;

margin-bottom:20px;

}

</style>

</head>

<body>

<div class="login-box">

<h1>🎸 Guitar Academy</h1>

<p>Admin Login</p>

{% if error %}

<div class="error">

{{ error }}

</div>

{% endif %}

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

</div>

</body>
</html>
