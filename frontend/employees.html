<!DOCTYPE html>

    <title>Employees</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow">

    <div class="container">

        <span class="navbar-brand fw-bold">

            Employee Management System

        </span>

        <a href="index.html" class="btn btn-light">

            Add Employee

        </a>

    </div>

</nav>
